# Trigger to run pipeline
on:
  # This event allows you to trigger the workflow manually from the GitHub Actions tab in your repository.
  workflow_dispatch:
    inputs:
      environment:
        description: 'What is the name of environment to deploy?'
        required: true
        default: 'dev'
      hub:
        description: 'Is a hub deployment needed?'
        required: true
        default: 'true'
# Name of deploy pipeline
name: deploy.beta.1

# Deploy pipeline jobs
jobs:
  Hub_Verificatiion:
    if: ${{ github.event.inputs.hub == 'true' }}
    name: Hub Pre-Verification
    runs-on: ubuntu-latest
    steps:
      - name: Login to Azure - Hub
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZ_SP_HUB }}
      - name: Checkout Repository
        uses: actions/checkout@v2
      - name: Terraform Hub - Setup Backend, Initialize, and Plan
        run: |
          cd "terraform/hub"
          cat >backend.tf <<EOL
          terraform {
            backend "azurerm" {
              subscription_id      = "$ARM_SUBSCRIPTION_ID"
              resource_group_name  = "$ARM_BACKEND_RESOURCE_GROUP_NAME"
              storage_account_name = "$ARM_BACKEND_STORAGE_ACCOUNT_NAME"
              container_name       = "$ARM_CONTAINER_NAME"
              key                  = "hub.tfstate"
            }
          }
          EOL
          terraform init
          terraform plan -var="HubSubscriptionId=${{ secrets.HUB_SUBSCRIPTION_ID }}" 
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_BACKEND_RESOURCE_GROUP_NAME: ${{ secrets.ARM_BACKEND_RESOURCE_GROUP_NAME }} 
          ARM_BACKEND_STORAGE_ACCOUNT_NAME: ${{ secrets.ARM_BACKEND_STORAGE_ACCOUNT_NAME }}
          ARM_ACCESS_KEY: ${{ secrets.ARM_ACCESS_KEY }}
          ARM_CONTAINER_NAME: ${{ secrets.HUB_CONTAINER_NAME }}
          HUB_SUBSCRIPTION_ID: ${{ secrets.HUB_SUBSCRIPTION_ID }}
          VM_ADMIN_CREDENTIALS: ${{ secrets.VM_ADMIN_CREDENTIALS }}

  Hub_Deployment:
    if: ${{ github.event.inputs.hub == 'true' }}
    name: Hub Deployment
    needs: Hub_Verificatiion
    runs-on: ubuntu-latest
    # environment: 
    #   name: 'hub'
    steps:
      - name: Login to Azure - Hub
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZ_SP_HUB }}
      - name: Checkout Repository
        uses: actions/checkout@v2
      - name: Terraform Hub - Setup Backend and Apply
        run: |
          cd "terraform/hub"
          cat >backend.tf <<EOL
          terraform {
            backend "azurerm" {
              subscription_id      = "$ARM_SUBSCRIPTION_ID"
              resource_group_name  = "$ARM_BACKEND_RESOURCE_GROUP_NAME"
              storage_account_name = "$ARM_BACKEND_STORAGE_ACCOUNT_NAME"
              container_name       = "$ARM_CONTAINER_NAME"
              key                  = "hub.tfstate"
            }
          }
          EOL
          terraform init
          terraform apply -auto-approve -var="HubSubscriptionId=${{ secrets.HUB_SUBSCRIPTION_ID }}"
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_BACKEND_RESOURCE_GROUP_NAME: ${{ secrets.ARM_BACKEND_RESOURCE_GROUP_NAME }} 
          ARM_BACKEND_STORAGE_ACCOUNT_NAME: ${{ secrets.ARM_BACKEND_STORAGE_ACCOUNT_NAME }}
          ARM_ACCESS_KEY: ${{ secrets.ARM_ACCESS_KEY }}
          ARM_CONTAINER_NAME: ${{ secrets.HUB_CONTAINER_NAME }}
          HUB_SUBSCRIPTION_ID: ${{ secrets.HUB_SUBSCRIPTION_ID }}
          VM_ADMIN_CREDENTIALS: ${{ secrets.VM_ADMIN_CREDENTIALS }}

  App_Verification:
    name: ${{ github.event.inputs.environment }} Pre-Verification
    needs: Hub_Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets['AZ_SP_' + github.event.inputs.environment] }}
      - name: Checkout Repository
        uses: actions/checkout@v2
      - name: Terraform - Setup Backend, Initialize, and Plan
        run: |
          cd "terraform/${{ github.event.inputs.environment }}"
          cat >backend.tf <<EOL
          terraform {
            backend "azurerm" {
              subscription_id      = "$ARM_SUBSCRIPTION_ID"
              resource_group_name  = "$ARM_BACKEND_RESOURCE_GROUP_NAME"
              storage_account_name = "$ARM_BACKEND_STORAGE_ACCOUNT_NAME"
              container_name       = "$ARM_CONTAINER_NAME"
              key                  = "${{ github.event.inputs.environment }}.tfstate"
            }
          }
          EOL
          terraform init
          terraform plan -var="${{ github.event.inputs.environment }}SubscriptionId=${{ secrets[github.event.inputs.environment + '_SUBSCRIPTION_ID'] }}" -var="HubSubscriptionId=${{ secrets.HUB_SUBSCRIPTION_ID }}" -var="AdminPassword=${{ secrets.VM_ADMIN_CREDENTIALS }}" -var="HubEnabled=${{ github.event.inputs.hub }}"
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_BACKEND_RESOURCE_GROUP_NAME: ${{ secrets.ARM_BACKEND_RESOURCE_GROUP_NAME }} 
          ARM_BACKEND_STORAGE_ACCOUNT_NAME: ${{ secrets.ARM_BACKEND_STORAGE_ACCOUNT_NAME }}
          ARM_ACCESS_KEY: ${{ secrets.ARM_ACCESS_KEY }}
          ARM_CONTAINER_NAME: ${{ secrets[github.event.inputs.environment + '_CONTAINER_NAME'] }}
          DEV_SUBSCRIPTION_ID: ${{ secrets[github.event.inputs.environment + '_SUBSCRIPTION_ID'] }}
          VM_ADMIN_CREDENTIALS: ${{ secrets.VM_ADMIN_CREDENTIALS }}

  App_Deployment:
    name: ${{ github.event.inputs.environment }} Deployment
    needs: App_Verification
    runs-on: ubuntu-latest
    steps:
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets['AZ_SP_' + github.event.inputs.environment] }}
      - name: Checkout Repository
        uses: actions/checkout@v2
      - name: Terraform - Setup Backend and Apply
        run: |
          cd "terraform/${{ github.event.inputs.environment }}"
          cat >backend.tf <<EOL
          terraform {
            backend "azurerm" {
              subscription_id      = "$ARM_SUBSCRIPTION_ID"
              resource_group_name  = "$ARM_BACKEND_RESOURCE_GROUP_NAME"
              storage_account_name = "$ARM_BACKEND_STORAGE_ACCOUNT_NAME"
              container_name       = "$ARM_CONTAINER_NAME"
              key                  = "${{ github.event.inputs.environment }}.tfstate"
            }
          }
          EOL
          terraform init
          terraform apply -auto-approve -var="${{ github.event.inputs.environment }}SubscriptionId=${{ secrets[github.event.inputs.environment + '_SUBSCRIPTION_ID'] }}" -var="HubSubscriptionId=${{ secrets.HUB_SUBSCRIPTION_ID }}" -var="AdminPassword=${{ secrets.VM_ADMIN_CREDENTIALS }}" -var="HubEnabled=${{ github.event.inputs.hub }}"
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_BACKEND_RESOURCE_GROUP_NAME: ${{ secrets.ARM_BACKEND_RESOURCE_GROUP_NAME }} 
          ARM_BACKEND_STORAGE_ACCOUNT_NAME: ${{ secrets.ARM_BACKEND_STORAGE_ACCOUNT_NAME }}
          ARM_ACCESS_KEY: ${{ secrets.ARM_ACCESS_KEY }}
          ARM_CONTAINER_NAME: ${{ secrets[github.event.inputs.environment + '_CONTAINER_NAME'] }}
          DEV_SUBSCRIPTION_ID: ${{ secrets[github.event.inputs.environment + '_SUBSCRIPTION_ID'] }}
          VM_ADMIN_CREDENTIALS: ${{ secrets.VM_ADMIN_CREDENTIALS }}

