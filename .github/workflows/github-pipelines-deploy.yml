# Trigger to run pipeline
on:
  # This event allows you to trigger the workflow manually from the GitHub Actions tab in your repository.
  workflow_dispatch:

# env:
#   majorVersion: '24'
#   minorVersion: '05'

# Name of deploy pipeline
name: deploy.beta.1

# Deploy pipeline jobs
jobs:
  Hub_Deployment:
    name: Hub Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Login to Azure - Hub
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZ_SP_HUB }}
      - name: Checkout Repository
        uses: actions/checkout@v2
      - name: Terraform Init and Plan
        run: |
          cd "terraform/hub"
          terraform init
          terraform plan
        env:
          ARM_BACKEND_CONTAINER_NAME: sls-terraform-state-hub
          ARM_BACKEND_KEY: hub.tfstate
          ARM_BACKEND_STORAGE_ACCOUNT_NAME: ${{ secrets.ARM_BACKEND_STORAGE_ACCOUNT_NAME }}
      - name: Login to Azure - Prod
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZ_SP_PROD }}
      - name: Checkout Repository
        uses: actions/checkout@v2
      - name: Show Default Directory
        run: |
          echo "The current directory is $PWD and it's contents are:"
          ls -al
      - name: Login to Azure - Dev
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZ_SP_DEV }}
      - name: Checkout Repository
        uses: actions/checkout@v2
      - name: Show Default Directory
        run: |
          echo "The current directory is $PWD and it's contents are:"
          ls -al

