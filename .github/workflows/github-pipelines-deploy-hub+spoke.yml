# General Notes
# -Passing lists directly through GitHub Actions Secrets or Variables causes deployment issues.


# Trigger to run pipeline
on:
  # This event allows you to trigger the workflow manually from the GitHub Actions tab in your repository.
  workflow_dispatch:
    inputs:
      hub:
        description: 'Is a hub & spoke deployment needed?'
        required: true
        default: 'true'
      environment:
        description: 'Please select a spoke name: dev, test, or prod (case sensitive)?'
        required: true
        default: 'dev'
      terraform_action:
        description: 'Would you like to run a Terraform apply or destroy command (case sensitive)?'
        required: true
        default: 'apply'
      # spoke_model: # Aimed for Release 24.07 or later
      #   description: 'Is the spoke cloud service model IaaS or PaaS?'
      #   required: true
      #   default: 'IaaS'

# Name of deploy pipeline
name: deploy.beta.hub+spoke

# Deploy pipeline jobs
jobs:
  ### Hub & Spoke Model
  Input_Verification:
    name: User Input Verification
    runs-on: ubuntu-latest
    steps:
      - name: Verify Environment Name is dev, test, or prod
        run: |
          if [[ "${{ github.event.inputs.environment }}" =~ ^(dev|test|prod)$ ]]; then
              echo "Environment name is valid."
          else
              echo "Environment name is invalid. Please input either dev, test, or prod (case sensitive)."
              exit 1
          fi
      - name: Verify Terraform Action is apply or destroy
        run: |
          if [[ "${{ github.event.inputs.terraform_action }}" =~ ^(apply|destroy)$ ]]; then
              echo "Terraform action is valid."
          else
              echo "Terraform action is invalid. Please input either an apply or destroy command (case sensitive)."
              exit 1
          fi
  Hub_Verification:
    if: ${{ github.event.inputs.hub == 'true' }}
    name: Hub Pre-Verification
    needs: Input_Verification 
    runs-on: ubuntu-latest
    steps:
      - name: Set secret names
        id: set_secrets
        run: |
          echo "AZ_SP_SECRET_NAME=AZ_SP_HUB" >> $GITHUB_ENV
          echo "SUBSCRIPTION_ID_SECRET_NAME=HUB_SUBSCRIPTION_ID" >> $GITHUB_ENV
          echo "CONTAINER_NAME_SECRET_NAME=HUB_CONTAINER_NAME" >> $GITHUB_ENV
      - name: Login to Azure - Hub
        uses: azure/login@v1
        with:
          creds: ${{ secrets[env.AZ_SP_SECRET_NAME] }}
      - name: Checkout Repository
        uses: actions/checkout@v2
      - name: Terraform Hub - Setup Backend, Initialize, and Plan
        run: |
          cd "terraform/hub"
          cat >backend.tf <<EOL
          terraform {
            backend "azurerm" {
              subscription_id      = "$ARM_SUBSCRIPTION_ID"
              resource_group_name  = "$ARM_BACKEND_RESOURCE_GROUP_NAME"
              storage_account_name = "$ARM_BACKEND_STORAGE_ACCOUNT_NAME"
              container_name       = "$ARM_CONTAINER_NAME"
              key                  = "hub.tfstate"
            }
          }
          EOL

          terraform init
          if [ ${{ github.event.inputs.terraform_action }} = "apply" ]; then
              terraform plan \
                -var="HubSubscriptionId=${{ secrets.HUB_SUBSCRIPTION_ID }}" \
                -var="VnetAddressSpace=${HUB_VNET_CIDR}" \
                -var="BastionSubnetPrefix=${BASTION_SUBNET_CIDR}" \
                -var="GatewaySubnetPrefix=${GATEWAY_SUBNET_CIDR}" \
                -var="MgmtSubnetPrefix=${MGMT_SUBNET_CIDR}"
          elif [ ${{ github.event.inputs.terraform_action }} = "destroy" ]; then
              terraform plan -destroy \
                -var="HubSubscriptionId=${{ secrets.HUB_SUBSCRIPTION_ID }}" \
                -var="VnetAddressSpace=${HUB_VNET_CIDR}" \
                -var="BastionSubnetPrefix=${BASTION_SUBNET_CIDR}" \
                -var="GatewaySubnetPrefix=${GATEWAY_SUBNET_CIDR}" \
                -var="MgmtSubnetPrefix=${MGMT_SUBNET_CIDR}"
          else
              echo "Please input either an apply or destroy command (case sensitive)."
              exit 1
          fi
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_BACKEND_RESOURCE_GROUP_NAME: ${{ secrets.ARM_BACKEND_RESOURCE_GROUP_NAME }} 
          ARM_BACKEND_STORAGE_ACCOUNT_NAME: ${{ secrets.ARM_BACKEND_STORAGE_ACCOUNT_NAME }}
          ARM_CONTAINER_NAME: ${{ secrets.HUB_CONTAINER_NAME }}
          HUB_VNET_CIDR: ${{ secrets.HUB_VNET_CIDR }}
          BASTION_SUBNET_CIDR: ${{ secrets.BASTION_SUBNET_CIDR }}
          GATEWAY_SUBNET_CIDR: ${{ secrets.GATEWAY_SUBNET_CIDR }}
          MGMT_SUBNET_CIDR: ${{ secrets.MGMT_SUBNET_CIDR }} 

  Hub_Deployment:
    if: ${{ github.event.inputs.hub == 'true' }}
    name: Hub Deployment
    needs: Hub_Verification
    runs-on: ubuntu-latest
    steps:
      - name: Set secret names
        id: set_secrets
        run: |
          echo "AZ_SP_SECRET_NAME=AZ_SP_HUB" >> $GITHUB_ENV
          echo "SUBSCRIPTION_ID_SECRET_NAME=HUB_SUBSCRIPTION_ID" >> $GITHUB_ENV
          echo "CONTAINER_NAME_SECRET_NAME=HUB_CONTAINER_NAME" >> $GITHUB_ENV
      - name: Login to Azure - Hub
        uses: azure/login@v1
        with:
          creds: ${{ secrets[env.AZ_SP_SECRET_NAME] }}
      - name: Checkout Repository
        uses: actions/checkout@v2
      - name: Terraform Hub - Setup Backend and Apply
        run: |
          cd "terraform/hub"
          cat >backend.tf <<EOL
          terraform {
            backend "azurerm" {
              subscription_id      = "$ARM_SUBSCRIPTION_ID"
              resource_group_name  = "$ARM_BACKEND_RESOURCE_GROUP_NAME"
              storage_account_name = "$ARM_BACKEND_STORAGE_ACCOUNT_NAME"
              container_name       = "$ARM_CONTAINER_NAME"
              key                  = "hub.tfstate"
            }
          }
          EOL
          terraform init
          terraform ${{ github.event.inputs.terraform_action }} -auto-approve \
            -var="HubSubscriptionId=${{ secrets.HUB_SUBSCRIPTION_ID }}" \
            -var="VnetAddressSpace=${HUB_VNET_CIDR}" \
            -var="BastionSubnetPrefix=${BASTION_SUBNET_CIDR}" \
            -var="GatewaySubnetPrefix=${GATEWAY_SUBNET_CIDR}" \
            -var="MgmtSubnetPrefix=${MGMT_SUBNET_CIDR}"
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_BACKEND_RESOURCE_GROUP_NAME: ${{ secrets.ARM_BACKEND_RESOURCE_GROUP_NAME }} 
          ARM_BACKEND_STORAGE_ACCOUNT_NAME: ${{ secrets.ARM_BACKEND_STORAGE_ACCOUNT_NAME }}
          ARM_CONTAINER_NAME: ${{ secrets.HUB_CONTAINER_NAME }}
          HUB_VNET_CIDR: ${{ secrets.HUB_VNET_CIDR }}
          BASTION_SUBNET_CIDR: ${{ secrets.BASTION_SUBNET_CIDR }}
          GATEWAY_SUBNET_CIDR: ${{ secrets.GATEWAY_SUBNET_CIDR }}
          MGMT_SUBNET_CIDR: ${{ secrets.MGMT_SUBNET_CIDR }} 
      - name: Set output
        id: deployment_output
        run: echo "::set-output name=run::true"

### Spoke with Hub
  App_Verification:
    if: ${{ github.event.inputs.hub == 'true' }}
    name: Pre-Verification - ${{ inputs.environment }} environment
    needs: Hub_Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Set secret names
        id: set_secrets
        run: |
          echo "AZ_SP_SECRET_NAME=AZ_SP_${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          echo "SUBSCRIPTION_ID_SECRET_NAME=${{ github.event.inputs.environment }}_SUBSCRIPTION_ID" >> $GITHUB_ENV
          echo "CONTAINER_NAME_SECRET_NAME=${{ github.event.inputs.environment }}_CONTAINER_NAME" >> $GITHUB_ENV
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets[env.AZ_SP_SECRET_NAME] }}
      - name: Checkout Repository
        uses: actions/checkout@v2
      - name: Terraform - Setup Backend, Initialize, and Plan
        run: |
          cd "terraform/spoke"
          cat >backend.tf <<EOL
          terraform {
            backend "azurerm" {
              subscription_id      = "$ARM_SUBSCRIPTION_ID"
              resource_group_name  = "$ARM_BACKEND_RESOURCE_GROUP_NAME"
              storage_account_name = "$ARM_BACKEND_STORAGE_ACCOUNT_NAME"
              container_name       = "$ARM_CONTAINER_NAME"
              key                  = "${{ github.event.inputs.environment }}.tfstate"
            }
          }
          EOL
          terraform init
          if [ ${{ github.event.inputs.terraform_action }} = "apply" ]; then
            if [ ${{ github.event.inputs.environment }} = "prod" ]; then
              terraform plan \
                -var="SubscriptionId=${{ secrets[env.SUBSCRIPTION_ID_SECRET_NAME] }}" \
                -var="HubSubscriptionId=${{ secrets.HUB_SUBSCRIPTION_ID }}" \
                -var="AdminPassword=${{ secrets.VM_ADMIN_CREDENTIALS }}" \
                -var="HubEnabled=true" \
                -var="EnvName=hs-${{ github.event.inputs.environment }}" \
                -var="VnetAddressSpace=${PROD_VNET_CIDR}" \
                -var="WorkloadSubnetPrefix=${PROD_WORKLOAD_SUBNET_CIDR}"
            elif [ ${{ github.event.inputs.environment }} = "test" ]; then
              terraform plan \
                -var="SubscriptionId=${{ secrets[env.SUBSCRIPTION_ID_SECRET_NAME] }}" \
                -var="HubSubscriptionId=${{ secrets.HUB_SUBSCRIPTION_ID }}" \
                -var="AdminPassword=${{ secrets.VM_ADMIN_CREDENTIALS }}" \
                -var="HubEnabled=true" \
                -var="EnvName=hs-${{ github.event.inputs.environment }}" \
                -var="VnetAddressSpace=${TEST_VNET_CIDR}" \
                -var="WorkloadSubnetPrefix=${TEST_WORKLOAD_SUBNET_CIDR}"
            elif [ ${{ github.event.inputs.environment }} = "dev" ]; then
              terraform plan \
                -var="SubscriptionId=${{ secrets[env.SUBSCRIPTION_ID_SECRET_NAME] }}" \
                -var="HubSubscriptionId=${{ secrets.HUB_SUBSCRIPTION_ID }}" \
                -var="AdminPassword=${{ secrets.VM_ADMIN_CREDENTIALS }}" \
                -var="HubEnabled=true" \
                -var="EnvName=hs-${{ github.event.inputs.environment }}" \
                -var="VnetAddressSpace=${DEV_VNET_CIDR}" \
                -var="WorkloadSubnetPrefix=${DEV_WORKLOAD_SUBNET_CIDR}"
            else
              echo "Please input either dev, test, or prod (case sensitive)."
              exit 1
            fi
          elif [ ${{ github.event.inputs.terraform_action }} = "destroy" ]; then
            if [ ${{ github.event.inputs.environment }} = "prod" ]; then
              terraform plan -destroy \
                -var="SubscriptionId=${{ secrets[env.SUBSCRIPTION_ID_SECRET_NAME] }}" \
                -var="HubSubscriptionId=${{ secrets.HUB_SUBSCRIPTION_ID }}" \
                -var="AdminPassword=${{ secrets.VM_ADMIN_CREDENTIALS }}" \
                -var="HubEnabled=false" \
                -var="EnvName=hs-${{ github.event.inputs.environment }}" \
                -var="VnetAddressSpace=${PROD_VNET_CIDR}" \
                -var="WorkloadSubnetPrefix=${PROD_WORKLOAD_SUBNET_CIDR}"
            elif [ ${{ github.event.inputs.environment }} = "test" ]; then
              terraform plan -destroy \
                -var="SubscriptionId=${{ secrets[env.SUBSCRIPTION_ID_SECRET_NAME] }}" \
                -var="HubSubscriptionId=${{ secrets.HUB_SUBSCRIPTION_ID }}" \
                -var="AdminPassword=${{ secrets.VM_ADMIN_CREDENTIALS }}" \
                -var="HubEnabled=false" \
                -var="EnvName=hs-${{ github.event.inputs.environment }}" \
                -var="VnetAddressSpace=${TEST_VNET_CIDR}" \
                -var="WorkloadSubnetPrefix=${TEST_WORKLOAD_SUBNET_CIDR}"
            elif [ ${{ github.event.inputs.environment }} = "dev" ]; then
              terraform plan -destroy \
                -var="SubscriptionId=${{ secrets[env.SUBSCRIPTION_ID_SECRET_NAME] }}" \
                -var="HubSubscriptionId=${{ secrets.HUB_SUBSCRIPTION_ID }}" \
                -var="AdminPassword=${{ secrets.VM_ADMIN_CREDENTIALS }}" \
                -var="HubEnabled=false" -var="EnvName=hs-${{ github.event.inputs.environment }}" \
                -var="VnetAddressSpace=${DEV_VNET_CIDR}" \
                -var="WorkloadSubnetPrefix=${DEV_WORKLOAD_SUBNET_CIDR}"
            else
              echo "Please input either dev, test, or prod (case sensitive)."
              exit 1
            fi
          else
              echo "Please input either an apply or destroy command (case sensitive)."
              exit 1
          fi
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_BACKEND_RESOURCE_GROUP_NAME: ${{ secrets.ARM_BACKEND_RESOURCE_GROUP_NAME }} 
          ARM_BACKEND_STORAGE_ACCOUNT_NAME: ${{ secrets.ARM_BACKEND_STORAGE_ACCOUNT_NAME }}
          ARM_CONTAINER_NAME: "sls-terraform-state-${{ github.event.inputs.environment }}"
          PROD_VNET_CIDR: ${{ vars.PROD_VNET_CIDR }}
          PROD_WORKLOAD_SUBNET_CIDR: ${{ vars.PROD_WORKLOAD_SUBNET_CIDR }}
          TEST_VNET_CIDR: ${{ vars.TEST_VNET_CIDR }}
          TEST_WORKLOAD_SUBNET_CIDR: ${{ vars.TEST_WORKLOAD_SUBNET_CIDR }}
          DEV_VNET_CIDR: ${{ vars.DEV_VNET_CIDR }}
          DEV_WORKLOAD_SUBNET_CIDR: ${{ vars.DEV_WORKLOAD_SUBNET_CIDR }}

  App_Deployment:
    if: ${{ github.event.inputs.hub == 'true' }}
    name: Deployment - ${{ inputs.environment }} environment
    needs: App_Verification
    runs-on: ubuntu-latest
    steps:
      - name: Set secret names
        id: set_secrets
        run: |
          echo "AZ_SP_SECRET_NAME=AZ_SP_${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          echo "SUBSCRIPTION_ID_SECRET_NAME=${{ github.event.inputs.environment }}_SUBSCRIPTION_ID" >> $GITHUB_ENV
          echo "CONTAINER_NAME_SECRET_NAME=${{ github.event.inputs.environment }}_CONTAINER_NAME" >> $GITHUB_ENV
      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets[env.AZ_SP_SECRET_NAME] }}
      - name: Checkout Repository
        uses: actions/checkout@v2
      - name: Terraform - Setup Backend and Apply
        run: |
          cd "terraform/spoke"
          cat >backend.tf <<EOL
          terraform {
            backend "azurerm" {
              subscription_id      = "$ARM_SUBSCRIPTION_ID"
              resource_group_name  = "$ARM_BACKEND_RESOURCE_GROUP_NAME"
              storage_account_name = "$ARM_BACKEND_STORAGE_ACCOUNT_NAME"
              container_name       = "$ARM_CONTAINER_NAME"
              key                  = "${{ github.event.inputs.environment }}.tfstate"
            }
          }
          EOL
          terraform init
          if [ ${{ github.event.inputs.terraform_action }} = "apply" ]; then
            if [ ${{ github.event.inputs.environment }} = "prod" ]; then
              terraform apply -auto-approve \
                -var="SubscriptionId=${{ secrets[env.SUBSCRIPTION_ID_SECRET_NAME] }}" \
                -var="HubSubscriptionId=${{ secrets.HUB_SUBSCRIPTION_ID }}" \
                -var="AdminPassword=${{ secrets.VM_ADMIN_CREDENTIALS }}" \
                -var="HubEnabled=true" \
                -var="EnvName=hs-${{ github.event.inputs.environment }}" \
                -var="VnetAddressSpace=${PROD_VNET_CIDR}" \
                -var="WorkloadSubnetPrefix=${PROD_WORKLOAD_SUBNET_CIDR}"
            elif [ ${{ github.event.inputs.environment }} = "test" ]; then
              terraform apply -auto-approve \
                -var="SubscriptionId=${{ secrets[env.SUBSCRIPTION_ID_SECRET_NAME] }}" \
                -var="HubSubscriptionId=${{ secrets.HUB_SUBSCRIPTION_ID }}" \
                -var="AdminPassword=${{ secrets.VM_ADMIN_CREDENTIALS }}" \
                -var="HubEnabled=true" \
                -var="EnvName=hs-${{ github.event.inputs.environment }}" \
                -var="VnetAddressSpace=${TEST_VNET_CIDR}" \
                -var="WorkloadSubnetPrefix=${TEST_WORKLOAD_SUBNET_CIDR}"
            elif [ ${{ github.event.inputs.environment }} = "dev" ]; then
              terraform apply -auto-approve \
                -var="SubscriptionId=${{ secrets[env.SUBSCRIPTION_ID_SECRET_NAME] }}" \
                -var="HubSubscriptionId=${{ secrets.HUB_SUBSCRIPTION_ID }}" \
                -var="AdminPassword=${{ secrets.VM_ADMIN_CREDENTIALS }}" \
                -var="HubEnabled=true" \
                -var="EnvName=hs-${{ github.event.inputs.environment }}" \
                -var="VnetAddressSpace=${DEV_VNET_CIDR}" \
                -var="WorkloadSubnetPrefix=${DEV_WORKLOAD_SUBNET_CIDR}"
            else
              echo "Please input either dev, test, or prod (case sensitive)."
              exit 1
            fi
          elif [ ${{ github.event.inputs.terraform_action }} = "destroy" ]; then
            if [ ${{ github.event.inputs.environment }} = "prod" ]; then
              terraform destroy -auto-approve \
                -var="SubscriptionId=${{ secrets[env.SUBSCRIPTION_ID_SECRET_NAME] }}" \
                -var="HubSubscriptionId=${{ secrets.HUB_SUBSCRIPTION_ID }}" \
                -var="AdminPassword=${{ secrets.VM_ADMIN_CREDENTIALS }}" \
                -var="HubEnabled=false" \
                -var="EnvName=hs-${{ github.event.inputs.environment }}" \
                -var="VnetAddressSpace=${PROD_VNET_CIDR}" \
                -var="WorkloadSubnetPrefix=${PROD_WORKLOAD_SUBNET_CIDR}"
            elif [ ${{ github.event.inputs.environment }} = "test" ]; then
              terraform destroy -auto-approve \
                -var="SubscriptionId=${{ secrets[env.SUBSCRIPTION_ID_SECRET_NAME] }}" \
                -var="HubSubscriptionId=${{ secrets.HUB_SUBSCRIPTION_ID }}" \
                -var="AdminPassword=${{ secrets.VM_ADMIN_CREDENTIALS }}" \
                -var="HubEnabled=false" \
                -var="EnvName=hs-${{ github.event.inputs.environment }}" \
                -var="VnetAddressSpace=${TEST_VNET_CIDR}" \
                -var="WorkloadSubnetPrefix=${TEST_WORKLOAD_SUBNET_CIDR}"
            elif [ ${{ github.event.inputs.environment }} = "dev" ]; then
              terraform destroy -auto-approve \
                -var="SubscriptionId=${{ secrets[env.SUBSCRIPTION_ID_SECRET_NAME] }}" \
                -var="HubSubscriptionId=${{ secrets.HUB_SUBSCRIPTION_ID }}" \
                -var="AdminPassword=${{ secrets.VM_ADMIN_CREDENTIALS }}" \
                -var="HubEnabled=false" \
                -var="EnvName=hs-${{ github.event.inputs.environment }}" \
                -var="VnetAddressSpace=${DEV_VNET_CIDR}" \
                -var="WorkloadSubnetPrefix=${DEV_WORKLOAD_SUBNET_CIDR}"
            else
              echo "Please input either dev, test, or prod (case sensitive)."
              exit 1
            fi
          else
              echo "Please input either an apply or destroy command (case sensitive)."
              exit 1
          fi         
        env:
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_BACKEND_RESOURCE_GROUP_NAME: ${{ secrets.ARM_BACKEND_RESOURCE_GROUP_NAME }} 
          ARM_BACKEND_STORAGE_ACCOUNT_NAME: ${{ secrets.ARM_BACKEND_STORAGE_ACCOUNT_NAME }}
          ARM_CONTAINER_NAME: "sls-terraform-state-${{ github.event.inputs.environment }}"
          PROD_VNET_CIDR: ${{ vars.PROD_VNET_CIDR }}
          PROD_WORKLOAD_SUBNET_CIDR: ${{ vars.PROD_WORKLOAD_SUBNET_CIDR }}
          TEST_VNET_CIDR: ${{ vars.TEST_VNET_CIDR }}
          TEST_WORKLOAD_SUBNET_CIDR: ${{ vars.TEST_WORKLOAD_SUBNET_CIDR }}
          DEV_VNET_CIDR: ${{ vars.DEV_VNET_CIDR }}
          DEV_WORKLOAD_SUBNET_CIDR: ${{ vars.DEV_WORKLOAD_SUBNET_CIDR }}

