# Trigger to run pipeline
on:
  # Triggers the workflow on push request events
  push:
    branches-ignore:
      - 'tags/*'

env:
  majorVersion: '24'
  minorVersion: '06'
  azEnvironments: 'hub,prod,dev'

# Name of build pipeline
name: build.beta.1

# Build pipeline jobs
jobs:
  Build_Information:
    name: Build Information
    runs-on: ubuntu-latest
    steps:
      - name: Collect Build Information
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
          echo "Version: ${{ github.run_number }}"

  Validate_Terraform:
    name: Validate Terraform
    needs: Build_Information
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2
      - name: Validate Terraform Hub
        run: |
          echo "##### Validating Terraform for Hub Code #####"
          cd "terraform/hub"
          terraform -v
          terraform init -backend=false
          terraform validate
      - name: Validate Terraform Application
        run: |
          echo "##### Validating Terraform for Application Code #####"
          cd "terraform/dev"
          terraform -v
          terraform init -backend=false
          terraform validate
### Update folder above after testing.
  

  Tag_Commit_with_Version:
    name: Tag Commit with Version
    needs: Validate_Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2
        with:
          token: ${{ secrets.SLS_EXTERNAL_SUBSCRIPTIONS_GITHUB }}
      - name: Push Version Tag
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          ### Set the ENDTAG based on the branch, it will be appended to the tag
          BRANCH_NAME=${{ github.ref_name }}
          BRANCH_NAME=${BRANCH_NAME//_/-}
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "ENDTAG=" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == refs/heads/release/* ]]; then
            echo "ENDTAG=-release" >> $GITHUB_ENV
          else
            echo "ENDTAG=-$BRANCH_NAME" >> $GITHUB_ENV
          fi
      
          git tag "${{env.majorVersion}}.${{env.minorVersion}}.${{github.run_number}}${{env.ENDTAG}}"
          git push --tags

