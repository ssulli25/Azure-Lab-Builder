name: deploy.sls.utility

on:
  workflow_dispatch:
    inputs:
      script_name:
        description: 'Script to run'
        required: true
        type: choice
        options:
          - 'restart-vm-vmss-per-sub.ps1'
          - 'ms-windows-vm-vmss-update.ps1'
          - 'sub-cost-estimation.ps1'
          - 'sub-quota-usage.ps1'
          - 'ubuntu-linux-vm-vmss-update.ps1'
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - 'prod'
          - 'dev'
          - 'hub'

env:
  AZURE_PS_SCRIPT_PATH: 'scripts'

jobs:
  Run_Utility_Script:
    name: Run Utility Script
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2
      - name: Set secret names
        id: set_secrets
        shell: pwsh
        run: |
          "AZ_SP_SECRET_NAME=AZ_SP_${{ github.event.inputs.environment }}" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets[env.AZ_SP_SECRET_NAME] }}
          enable-AzPSSession: true
      - name: Map Environment to Subscription ID
        shell: pwsh
        run: |
          $envName = "${{ github.event.inputs.environment }}"
          if ($envName -eq "prod") {
            "SUB_ID=${{ secrets.PROD_SUBSCRIPTION_ID }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          } elseif ($envName -eq "dev") {
            "SUB_ID=${{ secrets.DEV_SUBSCRIPTION_ID }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          } elseif ($envName -eq "hub") {
            "SUB_ID=${{ secrets.HUB_SUBSCRIPTION_ID }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            Write-Error "Unknown environment: $envName"
            exit 1
          }
      - name: Run selected script
        shell: pwsh
        run: |
          $script = "${{ env.AZURE_PS_SCRIPT_PATH }}\${{ github.event.inputs.script_name }}"
          if (-not "${{ env.SUB_ID }}") {
            Write-Error "Subscription ID not found for environment"
            exit 1
          }
          & $script -SubscriptionId "${{ env.SUB_ID }}"