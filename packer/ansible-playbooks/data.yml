---
- name: Configure PostgreSQL on Linux
  hosts: all
  become: yes
  tasks:
    #############################################################################
    # Update all packages to the latest version
    #############################################################################
    - name: Update all packages to the latest version
      apt:
        upgrade: dist

    #############################################################################
    # Install PostgreSQL
    #############################################################################
    - name: Install dependencies for PostgreSQL
      apt:
        name: "{{ item }}"
        state: present
      loop:
        - curl
        - apt-transport-https

    - name: Add PostgreSQL package signing key
      shell: curl https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -

    - name: Add PostgreSQL repository
      shell: sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt/ $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'

    - name: Update package cache
      apt:
        update_cache: yes

    - name: Install PostgreSQL
      apt:
        name: postgresql-13
        state: present

    - name: Ensure PostgreSQL service is enabled and started
      systemd:
        name: postgresql
        enabled: yes
        state: started

    - name: Restart PostgreSQL service
      systemd:
        name: postgresql
        state: restarted
        enabled: yes

    #############################################################################
    # Install PostgreSQL command-line tools
    #############################################################################
    - name: Install PostgreSQL client tools
      apt:
        name: postgresql-client-13
        state: present

    - name: Add PostgreSQL tools to PATH
      lineinfile:
        path: /etc/profile.d/pgsql-tools.sh
        line: 'export PATH="$PATH:/usr/lib/postgresql/13/bin"'
        create: yes

    - name: Source PostgreSQL tools PATH
      shell: . /etc/profile.d/pgsql-tools.sh

    #############################################################################
    # Install and configure Azure CLI
    #############################################################################
    - name: Install dependencies for Azure CLI
      apt:
        name: "{{ item }}"
        state: present
      loop:
        - ca-certificates
        - curl
        - apt-transport-https
        - lsb-release
        - gnupg

    - name: Add Microsoft signing key
      apt_key:
        url: https://packages.microsoft.com/keys/microsoft.asc
        state: present

    - name: Add Azure CLI repository
      apt_repository:
        repo: "deb [arch=amd64] https://packages.microsoft.com/repos/azure-cli/ {{ ansible_facts['lsb']['codename'] }} main"
        state: present

    - name: Install Azure CLI
      apt:
        name: azure-cli
        state: present
        update_cache: yes

    #############################################################################
    # Disable UFW firewall
    #############################################################################
    - name: Disable UFW firewall
      ufw:
        state: disabled

    #############################################################################
    # Create a repository called /opt/sls-data
    #############################################################################
    - name: Create directory /opt/sls-data
      file:
        path: /opt/sls-data
        state: directory